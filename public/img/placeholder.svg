<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-label="Nema omota">
  <!-- background -->
  <rect width="300" height="400" fill="#25211b"/>
  <!-- dotted pattern -->
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.2" fill="#efe6d2" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="300" height="400" fill="url(#dots)"/>
  <!-- tri-colour stripe -->
  <rect x="0"   y="0" width="100" height="12" fill="#ff5a36"/>
  <rect x="100" y="0" width="100" height="12" fill="#f2b134"/>
  <rect x="200" y="0" width="100" height="12" fill="#2fb7a4"/>
  <!-- gamepad -->
  <g transform="translate(150 190)" fill="none" stroke="#a89f8c" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-70 -30 H70 a30 30 0 0 1 30 30 v20 a30 30 0 0 1 -52 20 l-14 -14 h-28 h-28 l-14 14 a30 30 0 0 1 -52 -20 v-20 a30 30 0 0 1 30 -30 z"/>
    <path d="M-60 -2 h28 M-46 -16 v28"/>
    <circle cx="40" cy="-8" r="5" fill="#a89f8c" stroke="none"/>
    <circle cx="58" cy="6" r="5" fill="#a89f8c" stroke="none"/>
  </g>
  <text x="150" y="300" text-anchor="middle" font-family="monospace" font-size="18" letter-spacing="3" fill="#a89f8c">BEZ OMOTA</text>
</svg>
